<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Main screen tests</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    /* Harness only: html/body/#app are 100% tall in the real page, so give each phone a fixed frame. */
    html, body { height: auto; background: #777; }
    #cases { display: flex; gap: 16px; align-items: flex-start; padding: 8px; }
    .case { width: 390px; height: 700px; position: relative; background: #fff; flex: none; }
    .label { color: #fff; font: 12px monospace; margin: 0 0 2px; }
    pre#out { margin: 0; padding: 8px; background: #fff; font-size: 13px; white-space: pre-wrap; word-break: break-word; }
    /* Hidden views must stay laid out (visibility, not display:none) or every measurement reads 0. */
    body[data-view="results"] #cases { visibility: hidden; position: absolute; top: 0; }
    body[data-view="cases"] pre#out { display: none; }
  </style>
</head>
<body>
<pre id="out">running...</pre>
<div id="cases"></div>
<script src="../js/weather.js"></script>
<script src="../js/recommend.js"></script>
<script src="../js/variation.js"></script>
<script src="../js/traits.js"></script>
<script src="../js/store.js"></script>
<script src="../js/art.js"></script>
<script src="../js/app.js"></script>
<script>
  // Renders canned weather through the real App.render, then checks what is actually in the DOM.
  document.body.dataset.view = new URLSearchParams(location.search).get("view") || "";
  const lines = [];
  let failed = 0;
  function check(name, ok, detail) {
    if (!ok) failed++;
    lines.push((ok ? "PASS " : "FAIL ") + name + (detail ? "  -> " + detail : ""));
  }

  const austin = { name: "Austin", state: "Texas", latitude: 30.26715, longitude: -97.74306 };
  const base = { temperatureF: 68, highF: 68, lowF: 55, precipProbability: 5, uvIndex: 1, windMph: 4, humidity: 50, weatherCode: 2 };
  // 15 plain days starting 2026-10-12; `over` patches individual days by index.
  function makeDays(over) {
    return Array.from({ length: 15 }, (_, i) =>
      Object.assign({ date: "2026-10-" + String(12 + i).padStart(2, "0"), isToday: i === 0 }, base, (over && over[i]) || {}));
  }
  const char = (id, personality) => ({ id: id, personality: personality });
  const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);

  const cases = [
    { id: "hot", title: "Hot, humid, sunny - today - 1 character",
      days: makeDays({ 0: { temperatureF: 88.3, humidity: 76, precipProbability: 19, uvIndex: 4.9, windMph: 6, weatherCode: 1 } }),
      dayIndex: 0, chars: [char("c1", "chill")] },
    { id: "freeze", title: "Snowy freezing forecast - day +3 - 2 characters",
      days: makeDays({ 3: { temperatureF: 28, highF: 28, humidity: 60, precipProbability: 10, windMph: 15, weatherCode: 71 } }),
      dayIndex: 3, chars: [char("c1", "grumpy"), char("c2", "anxious")] },
    { id: "rain", title: "Rainy mild - today - 5 characters",
      days: makeDays({ 0: { temperatureF: 64, humidity: 80, precipProbability: 70, weatherCode: 61 } }),
      dayIndex: 0, chars: [char("c1", "energetic"), char("c2", "anxious"), char("c3", "grumpy"), char("c4", "chill"), char("c5", "neutral")] },
    { id: "calm", title: "Calm mild day - today - no reminders",
      days: makeDays({}), dayIndex: 0, chars: [char("c1", "neutral")] },
  ];

  AppStore.clearAll();
  const cont = document.getElementById("cases");
  const frames = {};
  cases.forEach((c) => {
    const wrap = document.createElement("div");
    wrap.innerHTML = '<p class="label">' + c.title + '</p><div class="case"></div>';
    cont.appendChild(wrap);
    frames[c.id] = wrap.querySelector(".case");
    App.render(frames[c.id], { location: austin, days: c.days, dayIndex: c.dayIndex, characters: c.chars });
  });
  // First-run state (no saved location), rendered as a fifth frame.
  const noLoc = document.createElement("div");
  noLoc.innerHTML = '<p class="label">First run - no saved location</p><div class="case"></div>';
  cont.appendChild(noLoc);
  App.renderNoLocation(noLoc.querySelector(".case"));

  const $ = (root, sel) => root.querySelector(sel);
  const $$ = (root, sel) => Array.from(root.querySelectorAll(sel));
  const text = (root, sel) => ($(root, sel) ? $(root, sel).textContent.trim() : null);
  const rect = (el) => el.getBoundingClientRect();

  // --- Case: hot, humid, sunny, today ---
  let f = frames.hot;
  check("hot/today: shows 88F with the degree symbol and unit", text(f, ".temp") === "88°F", text(f, ".temp"));
  check("hot/today: condition text is Sunny", text(f, ".cond") === "Sunny", text(f, ".cond"));
  check("hot/today: no Forecast badge, no 'High' prefix", !$(f, ".badge") && !text(f, ".temp").startsWith("High"));
  check("hot/today: date reads Mon, Oct 12", text(f, ".date") === "Mon, Oct 12", text(f, ".date"));
  check("hot/today: location reads Austin, TX", text(f, ".place") === "Austin, TX", text(f, ".place"));
  check("hot/today: reminders are sunscreen + hydration only (from UV 4.9, heat index ~105; rain 19%)",
    $$(f, ".reminders li").map((li) => li.dataset.reminder).join() === "sunscreen,hydration");
  check("hot/today: reminder text is one of the defined wordings",
    $$(f, ".reminders li").every((li) => Variation.REMINDER_WORDINGS[li.dataset.reminder].includes(li.textContent.trim())));
  check("hot/today: 1 character, outfit is a 'hot' variation", $$(f, ".character").length === 1 && $(f, ".character").dataset.outfit.startsWith("hot-"), $(f, ".character").dataset.outfit);
  check("hot/today: data source credit with Open-Meteo link", $(f, '.source a[href="https://open-meteo.com/"]') !== null);

  // --- Case: snowy freezing forecast, day +3 ---
  f = frames.freeze;
  check("freeze/forecast: shows 'High 28°F'", text(f, ".temp") === "High 28°F", text(f, ".temp"));
  check("freeze/forecast: Forecast badge present", text(f, ".badge") === "Forecast");
  check("freeze/forecast: date reads Thu, Oct 15", text(f, ".date").startsWith("Thu, Oct 15"), text(f, ".date"));
  check("freeze/forecast: condition text is Snow", text(f, ".cond") === "Snow");
  check("freeze/forecast: cold caution shown (28F with 15 mph wind), no sunscreen/umbrella/hydration",
    $$(f, ".reminders li").map((li) => li.dataset.reminder).join() === "cold_caution");
  check("freeze/forecast: 2 characters, both in a 'freezing' outfit", $$(f, ".character").length === 2 && $$(f, ".character").every((c) => c.dataset.outfit.startsWith("freezing-")));

  // --- Case: rainy mild, 5 characters ---
  f = frames.rain;
  check("rain/today: condition text is Rain", text(f, ".cond") === "Rain");
  check("rain/today: umbrella is the only reminder", $$(f, ".reminders li").map((li) => li.dataset.reminder).join() === "umbrella");
  check("rain/today: 5 characters shown side by side", $$(f, ".character").length === 5);
  const figs = $$(f, ".character").map((c) => rect(c));
  check("rain/today: the 5 characters sit in one row without overlapping each other",
    figs.every((r, i) => i === 0 || r.left >= figs[i - 1].right - 0.5) && figs.every((r) => Math.abs(r.bottom - figs[0].bottom) < 2),
    figs.map((r) => Math.round(r.width)).join("/") + " px wide");
  check("rain/today: all 5 stay inside the 390px phone frame", figs.every((r) => r.left >= rect(f).left - 0.5 && r.right <= rect(f).right + 0.5));

  // --- Case: calm day ---
  f = frames.calm;
  check("calm/today: no reminder block at all when nothing triggers", $(f, ".reminders") === null);
  check("calm/today: condition text is Partly cloudy", text(f, ".cond") === "Partly cloudy");

  // --- One state drives everything (every case) ---
  cases.forEach((c) => {
    const root = frames[c.id];
    const day = c.days[c.dayIndex];
    const evaluation = Recommend.evaluate(day);
    const state = AppStore.resolveWithCache(evaluation, austin, day.date, c.chars[0]);
    const label = Art.WEATHER_ICONS[state.weatherConditionIcon].label;
    check(c.id + ": big scene icon, condition text and state icon all agree (" + state.weatherConditionIcon + ")",
      $(root, ".sky-icon").dataset.icon === state.weatherConditionIcon && text(root, ".cond") === label);
    check(c.id + ": every caption is the exact outfit named by that character's state",
      $$(root, ".character").every((el, i) => {
        const s = AppStore.resolveWithCache(evaluation, austin, day.date, c.chars[i]);
        const v = Object.values(Variation.OUTFIT_VARIATIONS).flat().find((x) => x.id === s.outfitVariation);
        return el.dataset.outfit === s.outfitVariation && el.querySelector("figcaption").textContent === v.name &&
          el.querySelector("svg").getAttribute("aria-label").includes(v.name.toLowerCase());
      }));
  });

  // --- Layout: text block never covers the characters; controls are big enough ---
  cases.forEach((c) => {
    const root = frames[c.id];
    const summaryBottom = rect($(root, ".summary")).bottom;
    // The figure is drawn at the bottom of its box (aspect 120:232), so measure where it really starts.
    const topOfArt = Math.min(...$$(root, ".character-art").map((a) => { const r = rect(a); return r.bottom - Math.min(r.height, (r.width * Art.FIGURE_HEIGHT) / Art.FIGURE_WIDTH); }));
    check(c.id + ": weather text ends above the characters (" + Math.round(summaryBottom) + " <= " + Math.round(topOfArt) + ")", summaryBottom <= topOfArt + 0.5);
    check(c.id + ": date stepper (previous, date, next) and location buttons are all at least 44x44",
      $$(root, ".ctl").length === 4 && $$(root, ".ctl").every((b) => rect(b).width >= 44 && rect(b).height >= 44));
    const frameRect = rect(root);
    check(c.id + ": date and location controls sit in the lower third of the phone (thumb reach)",
      $$(root, ".ctl").every((b) => rect(b).top >= frameRect.top + (frameRect.height * 2) / 3),
      "controls top at " + Math.round(rect($(root, ".controls")).top - frameRect.top) + " of " + Math.round(frameRect.height) + " px");
    // Text must fit inside its button: a clipped "Mon, Oct 1" next to an arrow is a real defect.
    const fits = (btn) => { const s = btn.querySelector("span"), st = getComputedStyle(btn); return s.getBoundingClientRect().width <= btn.clientWidth - parseFloat(st.paddingLeft) - parseFloat(st.paddingRight) + 0.5; };
    check(c.id + ": the date text fits inside its button (not clipped by the arrows)", fits($(root, '[data-action="open-date"]')),
      Math.round($(root, '[data-action="open-date"] span').getBoundingClientRect().width) + " px text in " + $(root, '[data-action="open-date"]').clientWidth + " px button");
    check(c.id + ": date button shows the selected date", $(root, '[data-action="open-date"]').textContent.trim() === text(root, ".date").replace("Forecast", "").trim());
    check(c.id + ": bottom nav has Home, Character, Settings, each at least 44 tall",
      $$(root, ".tab").map((t) => t.textContent.trim()).join() === "Home,Character,Settings" && $$(root, ".tab").every((t) => rect(t).height >= 44));
    check(c.id + ": every role=img SVG has a label", $$(root, 'svg[role="img"]').every((s) => s.getAttribute("aria-label")));
  });

  // --- Drawing matches the written outfit name (guards against name/art drift) ---
  const allOutfits = Object.values(Variation.OUTFIT_VARIATIONS).flat();
  const T0 = Traits.defaultCharacter("t0");
  check("every outfit id has a drawing spec", allOutfits.every((v) => Art.OUTFIT_LOOK[v.id]), allOutfits.length + " outfits");
  const nameRules = [
    [/tank|crop top/i, "sleeves", "none"],
    [/\btee\b|polo/i, "sleeves", "short"],
    [/long.sleeve|sweater|jacket|coat|parka|puffer|hoodie|sweatshirt|windbreaker/i, "sleeves", "long"],
    [/shorts/i, "pants", "short"],
    [/jeans|pants|joggers|leggings|sweats/i, "pants", "long"],
  ];
  const mismatches = [];
  allOutfits.forEach((v) => {
    const look = Art.OUTFIT_LOOK[v.id] || {};
    nameRules.forEach(([pattern, field, want]) => {
      if (pattern.test(v.name) && look[field] !== want) mismatches.push(v.id + ' "' + v.name + '": ' + field + " is " + look[field] + ", name implies " + want);
    });
    if (/coat|parka|puffer/i.test(v.name) && !look.coat) mismatches.push(v.id + ": name has a coat but drawing has none");
    // Accessories must match in BOTH directions: drawn if and only if the name mentions them.
    [["cap", /\bcap\b/i], ["sunHat", /sun hat/i], ["beanie", /beanie/i], ["scarf", /scarf/i], ["glasses", /sunglasses/i],
     ["hood", /hood/i], ["socks", /socks/i], ["crop", /crop/i], ["pockets", /cargo/i]].forEach(([flag, pattern]) => {
      if (pattern.test(v.name) !== Boolean(look[flag])) mismatches.push(v.id + ' "' + v.name + '": ' + flag + " is " + Boolean(look[flag]) + " but the name says " + pattern.test(v.name));
    });
    if (/zipped/i.test(v.name) && !look.zip) mismatches.push(v.id + ": name says zipped but the drawing has no zip");
    if (/puffer/i.test(v.name) && look.coat !== "puffer") mismatches.push(v.id + ": name says puffer but the coat is not drawn as one");
  });
  check("each outfit's drawing (sleeves, pants, coat, hats, scarf, hood, socks, crop top, pockets, zip, sunglasses) agrees with its written name", mismatches.length === 0, mismatches.join(" | "));
  check("every outfit defines its own top and bottom colours (valid hex)",
    allOutfits.every((v) => { const l = Art.OUTFIT_LOOK[v.id]; return /^#[0-9a-f]{6}$/i.test(l.top) && /^#[0-9a-f]{6}$/i.test(l.bottom); }));
  check("the 21 outfits are drawn as 21 distinct pictures", new Set(allOutfits.map((v) => Art.characterSvg({ character: T0, category: "mild", outfitId: v.id, tag: v.tag, view: "full", decorative: true }))).size === 21);
  check("the scene art and sky art differ for each of the 7 weather types",
    new Set(["clear", "partly_cloudy", "cloudy", "rain", "thunderstorm", "snow", "windy_fog"].map((i) => Art.sceneSvg(i).replace(/-\d+/g, ""))).size === 7 &&
    new Set(["clear", "partly_cloudy", "cloudy", "rain", "thunderstorm", "snow", "windy_fog"].map((i) => Art.skyArt(i))).size === 7);
  // --- Hoodies are always worn with the hood up, and no hair shows through ---
  const hoodOutfits = allOutfits.filter((v) => /hood/i.test(v.name));
  check("outfits that mention a hood or hoodie: " + hoodOutfits.map((v) => v.id).join(", "), hoodOutfits.length === 3);
  check("every hood or hoodie outfit is drawn with the hood UP (never down)", hoodOutfits.every((v) => Art.OUTFIT_LOOK[v.id].hood === "up"),
    hoodOutfits.map((v) => v.id + ":" + Art.OUTFIT_LOOK[v.id].hood).join(" "));
  check("no outfit is drawn with a hood down", allOutfits.every((v) => Art.OUTFIT_LOOK[v.id].hood === undefined || Art.OUTFIT_LOOK[v.id].hood === "up"));
  const visibleHair = Traits.HAIR.filter((h) => h.style !== "bald");
  const leaks = [];
  // Under a hood the figure must look exactly the same whatever the hairstyle, i.e. identical to bald.
  const drawWith = (v, hairId) => Art.characterSvg({ character: Object.assign({}, T0, { hair: hairId }), category: "cold", outfitId: v.id, tag: v.tag, view: "full", decorative: true });
  hoodOutfits.forEach((v) => {
    const bald = drawWith(v, "bald");
    visibleHair.forEach((h) => {
      // gradient ids are unique per drawing, so compare with those numbers removed
      const strip = (m) => m.replace(/-\d+/g, "-N");
      if (strip(drawWith(v, h.id)) !== strip(bald)) leaks.push(v.id + "/" + h.id);
    });
    if (!bald.includes('data-hood="band"')) leaks.push(v.id + " has no hood");
  });
  check("under a hood the drawing is identical for all 7 hairstyles and bald (no fringe, bun, spikes or locks poke out), for each hoodie", leaks.length === 0, leaks.join(", "));
  const controlHair = Art.characterSvg({ character: Object.assign({}, T0, { hair: "spiky-blond" }), category: "mild", outfitId: "mild-2", tag: "covered", view: "full", decorative: true });
  check("control: without a hood the same hairstyle IS drawn", controlHair.includes("#e0b84a") && !controlHair.includes('data-hood="band"'));

  // --- The hood is a thin, rounded band over the head, open under the chin, joined at the neck ---
  const NS = "http://www.w3.org/2000/svg";
  const svgHost = document.createElementNS(NS, "svg");
  document.body.appendChild(svgHost);
  const inFill = (d, x, y, rule) => { const p = document.createElementNS(NS, "path"); p.setAttribute("d", d); if (rule) p.setAttribute("fill-rule", rule); svgHost.appendChild(p); const r = p.isPointInFill(new DOMPoint(x, y)); p.remove(); return r; };
  const hoodProblems = [];
  Object.entries(Art.HOODS).forEach(([name, h]) => {
    // rounded top, not pointed: points a little to each side of the centre, just under the top, are cloth
    [[48, 15], [72, 15]].forEach(([x, y]) => { if (!inFill(h.band, x, y)) hoodProblems.push(name + ": top is pointed (" + x + "," + y + " is not cloth)"); });
    // open under the chin: neither the chin nor the neck is covered
    [[60, 70], [60, 78]].forEach(([x, y]) => { if (inFill(h.band, x, y)) hoodProblems.push(name + ": the hood closes under the chin (" + x + "," + y + ")"); });
    // joined at the base of the neck: both ends of the band reach the collar
    [[54, 85], [66, 85]].forEach(([x, y]) => { if (!inFill(h.band, x, y)) hoodProblems.push(name + ": an end of the hood does not reach the sides of the neck (" + x + "," + y + ")"); });
    // thin: measure the band across at ear level (y=44) and over the top (x=60)
    let side = 0; for (let x = 8; x < 60; x += 0.5) if (inFill(h.band, x, 44)) side += 0.5;
    let top = 0; for (let y = 0; y < 60; y += 0.5) if (inFill(h.band, 60, y)) top += 0.5;
    if (side > 11) hoodProblems.push(name + ": too thick at the sides (" + side + ")");
    const topLimit = { classic: 12, puffy: 15, slouch: 16 }[name]; // the thin hood is strict; the padded and slouchy ones are meant to be a little thicker on top
    if (top > topLimit) hoodProblems.push(name + ": too thick over the top (" + top + " > " + topLimit + ")");
    // covers the top of the head: the head circle's top arc is under the band (not bare skin sticking out)
    for (let deg = 215; deg <= 325; deg += 10) {
      const x = 60 + 28.8 * Math.cos((deg * Math.PI) / 180), y = 42 + 28.8 * Math.sin((deg * Math.PI) / 180);
      if (!inFill(h.band, x, y) && !inFill(h.inside, x, y)) hoodProblems.push(name + ": the head pokes out of the hood at " + deg + "deg");
    }
  });
  check("every hood style is a thin rounded band: rounded top, open under the chin, both ends reach the neck, thin at the sides and top, and it covers the top of the head", hoodProblems.length === 0, hoodProblems.slice(0, 4).join(" | "));
  svgHost.remove();
  check("the three hoods differ from each other (classic, puffy, slouch), and the hooded outfits use all three",
    new Set(Object.values(Art.HOODS).map((h) => h.band)).size === 3 && new Set(["freezing-1", "cold-1", "cold-2"].map((id) => Art.OUTFIT_LOOK[id].hoodStyle)).size === 3);
  // the back of the hood fills the windows beside the head, so the scene never shows through them
  const hoodSvgFor = (id) => Art.characterSvg({ character: T0, category: "cold", outfitId: id, tag: "sporty", view: "full", decorative: true });
  const windowPointsBehind = [];
  const svgHost3 = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  document.body.appendChild(svgHost3);
  const fillsPoint = (d, x, y) => { const p = document.createElementNS("http://www.w3.org/2000/svg", "path"); p.setAttribute("d", d); svgHost3.appendChild(p); const r = p.isPointInFill(new DOMPoint(x, y)); p.remove(); return r; };
  Object.entries(Art.HOODS).forEach(([name, h]) => {
    // points in the windows: between the head circle (centre 60,42 r 28.8) and the band, beside the cheeks and neck, plus the gap beside the neck
    [[35, 58], [85, 58], [37, 68], [83, 68], [44, 78], [76, 78]].forEach(([x, y]) => {
      const insideBand = fillsPoint(h.band, x, y);
      const inHead = Math.hypot(x - 60, y - 42) <= 28.8;
      if (!insideBand && !inHead && !fillsPoint(h.back, x, y)) windowPointsBehind.push(name + " (" + x + "," + y + ")");
    });
  });
  svgHost3.remove();
  check("the back of the hood fills every window beside the head and neck (so the scene never shows through), for all three hoods", windowPointsBehind.length === 0, windowPointsBehind.join(" "));
  check("each hooded outfit draws the back of its hood", ["freezing-1", "cold-1", "cold-2"].every((id) => hoodSvgFor(id).includes('data-hood="back"')) && !hoodSvgFor("mild-2").includes('data-hood="back"'));
  check("no roll across the middle of the neck (crossed out by the Developer): the two ends of the hood meet at the sides of the neck instead",
    ["freezing-1", "cold-1", "cold-2"].every((id) => !hoodSvgFor(id).includes('data-hood="collar"')));
  // the band's two ends must nearly touch at the neck (a narrow gap, about the width of the neck)
  const neckGap = Object.entries(Art.HOODS).map(([name, h]) => { let gap = 0; for (let x = 40; x < 80; x += 0.5) if (!fillsPoint(h.band, x, 84) && x > 52 && x < 68) gap += 0.5; return name + ":" + gap; });
  check("the ends of every hood come down and in to meet at the neck: the gap between them at the base of the neck is no wider than the neck plus its outline (16)", neckGap.every((g) => Number(g.split(":")[1]) <= 16), neckGap.join(" "));
  // Under a hood the beard is still visible (only hair is hidden)
  const beardUnderHood = (hairId, facial) => Art.characterSvg({ character: Object.assign({}, T0, { hair: hairId, facialHair: facial }), category: "cold", outfitId: "cold-1", tag: "sporty", view: "full", decorative: true });
  check("under a hood the beard still shows in the hair colour while the hair itself does not",
    beardUnderHood("curly-auburn", "beard").includes("#8a3b1f") && !beardUnderHood("curly-auburn", "clean").includes("#8a3b1f"));

  // --- The hairline sits high on the forehead, not at eyebrow level ---
  check("hairline: the hair ends at least 6 units above the eyebrows at the centre of the forehead (it used to sit right on the brows)",
    Art.HAIRLINE.browY - Art.HAIRLINE.centreY >= 6, JSON.stringify(Art.HAIRLINE));
  check("the fringe is uneven tufts, not one smooth curve (the hair shape has several curve segments along the hairline)",
    (Art.characterSvg({ character: T0, category: "mild", outfitId: "preview", tag: null, view: "head", decorative: true }).match(/C\d+ \d+ \d+ \d+ \d+ \d+/g) || []).length >= 6);

  // --- Hair is drawn as one piece, and tall hair is not cut off ---
  const drawHair = (hairId) => Art.characterSvg({ character: Object.assign({}, T0, { hair: hairId }), category: "mild", outfitId: "preview", tag: null, view: "full", decorative: true });
  const hairHost = document.createElement("div");
  hairHost.style.cssText = "position:absolute;left:0;top:0;width:300px;height:520px;visibility:hidden";
  document.body.appendChild(hairHost);
  const hairIssues = [];
  Traits.HAIR.filter((h) => h.style !== "bald").forEach((h) => {
    hairHost.innerHTML = drawHair(h.id);
    const svg = hairHost.querySelector("svg");
    const vb = svg.viewBox.baseVal;
    // every hair shape is inside the drawing area
    svg.querySelectorAll("[fill]").forEach(() => {});
    const hairBoxes = Array.from(svg.querySelectorAll("path")).filter((p) => (p.getAttribute("fill") || "").includes(h.id) === false);
    const top = svg.getBBox().y;
    if (top < vb.y - 0.5) hairIssues.push(h.id + " is cut off at the top (" + top.toFixed(1) + " < " + vb.y + ")");
  });
  hairHost.remove();
  check("no hairstyle (spikes, bun, curls) is taller than the figure's drawing area, so none is cut off", hairIssues.length === 0, hairIssues.join(" | "));
  const merged = (hairId) => (drawHair(hairId).match(/stroke-width="2.4"/g) || []).length;
  check("each hairstyle has ONE outline around its whole silhouette, not one per piece (curly has no circle outlines)",
    merged("curly-auburn") === merged("short-brown") && merged("spiky-blond") === merged("short-brown"), "outlined groups: curly " + merged("curly-auburn") + ", short " + merged("short-brown") + ", spiky " + merged("spiky-blond"));
  check("spiky hair is a dome with spikes: the dome plus seven spikes are in the drawing", (drawHair("spiky-blond").match(/L/g) || []).length >= 14);

  // --- Facial hair ---
  const FS = Art.FACIAL_SHAPES;
  const NS2 = "http://www.w3.org/2000/svg";
  const host2 = document.createElementNS(NS2, "svg");
  document.body.appendChild(host2);
  const inShape = (d, x, y, rule) => { const p = document.createElementNS(NS2, "path"); p.setAttribute("d", d); if (rule) p.setAttribute("fill-rule", rule); host2.appendChild(p); const r = p.isPointInFill(new DOMPoint(x, y)); p.remove(); return r; };
  check("a goatee is a RING around the mouth: hair above (mustache), below (chin), left and right of it, and none on the mouth itself",
    inShape(FS.GOATEE, 60, 57, "evenodd") && inShape(FS.GOATEE, 60, 73, "evenodd") && inShape(FS.GOATEE, 46, 62, "evenodd") && inShape(FS.GOATEE, 74, 62, "evenodd") && !inShape(FS.GOATEE, 60, 63, "evenodd"));
  check("a plain beard leaves the upper lip and mouth free; a full beard covers the area up to the mustache line",
    !inShape(FS.JAW_BEARD, 60, 62) && inShape(FS.JAW_BEARD, 60, 75) && inShape(FS.FULL_BEARD, 60, 62));
  check("the beard's edges are natural, not one smooth curve: 10+ curve segments, six of them an uneven row of tufts along the bottom",
    (FS.FULL_BEARD.match(/C/g) || []).length >= 10);
  host2.remove();

  const faceDrawings = Traits.traitByKey("facialHair").options.map((o) => Art.characterSvg({ character: Object.assign({}, T0, { facialHair: o.id }), category: "mild", outfitId: "preview", tag: null, view: "head", decorative: true }));
  check("facial hair: 6 options (clean shaven, stubble, mustache, goatee, beard, full beard & mustache), each drawn differently",
    Traits.traitByKey("facialHair").options.map((o) => o.id).join() === "clean,stubble,mustache,goatee,beard,full" && new Set(faceDrawings).size === 6);
  check("facial hair takes the hair colour: auburn hair gives an auburn beard, and a bald head gets a dark brown one",
    Art.characterSvg({ character: Object.assign({}, T0, { hair: "bald", facialHair: "beard" }), category: "mild", outfitId: "preview", tag: null, view: "head", decorative: true }).includes("#3a2a22") &&
    Art.characterSvg({ character: Object.assign({}, T0, { hair: "bald", facialHair: "beard" }), category: "mild", outfitId: "preview", tag: null, view: "head", decorative: true }).includes("#000000") === false);
  check("stubble is kept inside the face (clipped to the head circle)", faceDrawings[1].includes("clip-path") && !faceDrawings[0].includes("stubble"));

  // --- Grin shows clenched, gritted teeth ---
  const grinHead = Art.characterSvg({ character: Object.assign({}, T0, { mouth: "grin" }), category: "mild", outfitId: "preview", tag: null, view: "head", decorative: true });
  const smileHead = Art.characterSvg({ character: Object.assign({}, T0, { mouth: "smile" }), category: "mild", outfitId: "preview", tag: null, view: "head", decorative: true });
  check("grin keeps the smiling mouth shape and fills it with clenched teeth (white, clench line, tooth divisions); a plain smile has none",
    grinHead.includes("M48 59.5q12 14 24 0z") && grinHead.includes('fill="#fff"') && grinHead.includes("M50.5 62.8H69.5M54.5 60.5V65M60 60.5V66.5M65.5 60.5V65") && !smileHead.includes("M50.5 62.8H69.5"));

  // --- Shadows: on the body only (clipped to the model), plus one shadow on the ground ---
  const shadowFigures = [];
  allOutfits.forEach((v) => shadowFigures.push(["outfit " + v.id, Art.characterSvg({ character: T0, category: "mild", outfitId: v.id, tag: v.tag, view: "full", decorative: true })]));
  ["skinny", "average", "fat"].forEach((b) => ["feminine", "masculine"].forEach((g) =>
    shadowFigures.push([b + "/" + g, Art.characterSvg({ character: Object.assign({}, T0, { bodyType: b, genderPresentation: g }), category: "mild", outfitId: "preview", tag: null, view: "full", decorative: true })])));
  const shadowHost = document.createElement("div");
  document.body.appendChild(shadowHost);
  const shadowProblems = [];
  shadowFigures.forEach(([label, markup]) => {
    shadowHost.innerHTML = markup;
    const bodyShadows = shadowHost.querySelectorAll('[data-shadow="body"]');
    const ground = shadowHost.querySelectorAll('[data-shadow="ground"]');
    if (!bodyShadows.length) shadowProblems.push(label + ": no body shadow at all");
    bodyShadows.forEach((el) => { if (!el.closest("[clip-path]")) shadowProblems.push(label + ": a body shadow is not clipped to the model"); });
    if (ground.length !== 1) shadowProblems.push(label + ": expected exactly one ground shadow");
    if (/rgba\(20,\s*10,\s*40/.test(markup.replace(/data-shadow="body" d="[^"]*" stroke="rgba\(20,10,40,\.16\)"/, ""))) shadowProblems.push(label + ": an unclipped dark shape is drawn");
  });
  shadowHost.remove();
  check("every body shadow (chin, between the legs, waist crease) is clipped to the model's own shape, in all " + shadowFigures.length + " figures; only the ground shadow lies outside it", shadowProblems.length === 0, shadowProblems.slice(0, 4).join(" | "));
  const headOnly = Art.characterSvg({ character: T0, category: "mild", outfitId: "preview", tag: null, view: "head", decorative: true });
  check("close-up head views have no ground shadow", !headOnly.includes('data-shadow="ground"'));

  const rendered = frames.hot.querySelector(".character-art").outerHTML;
  check("hot-day figure shows its outfit: hot-2 'light long sleeves, sun hat, sunglasses' draws sleeves and a hat and glasses",
    $(frames.hot, ".character").dataset.outfit !== "hot-2" || (rendered.includes("#d8c08a") && rendered.includes('fill="#1d1d1d"')));

  // --- Main character: in the middle, bigger, and the reminders use its wording ---
  const roster = [char("a", "energetic"), char("b", "anxious"), char("c", "grumpy"), char("d", "chill"), char("e", "neutral")];
  const orderIds = (n, mainId) => App.orderForStage(roster.slice(0, n), mainId).map((x) => x.id).join("");
  check("stage order: 1 character -> a", orderIds(1, "a") === "a");
  check("stage order: 2 characters, main b -> a b (main on the right of centre)", orderIds(2, "b") === "ab");
  check("stage order: 3 characters, main c -> a c b (main exactly in the middle)", orderIds(3, "c") === "acb", orderIds(3, "c"));
  check("stage order: 5 characters, main e -> a b e c d (main exactly in the middle)", orderIds(5, "e") === "abecd", orderIds(5, "e"));
  check("stage order: 5 characters, main a -> b c a d e", orderIds(5, "a") === "bcade", orderIds(5, "a"));
  check("stage order: unknown main id falls back to the first character as main (b a c)", orderIds(3, "zzz") === "bac", orderIds(3, "zzz"));

  const hotDay = makeDays({ 0: { temperatureF: 92, humidity: 60, precipProbability: 70, uvIndex: 7, weatherCode: 95 } });
  const mainRoot = document.createElement("div");
  mainRoot.style.cssText = "width:390px;height:700px;position:absolute;left:0;top:0;visibility:hidden"; // laid out, not shown
  document.body.appendChild(mainRoot);
  App.render(mainRoot, { location: austin, days: hotDay, dayIndex: 0, characters: roster.slice(0, 3), mainId: "c" });
  const figsRow = $$(mainRoot, ".character");
  check("main character renders in the middle slot and is flagged main", figsRow.length === 3 && figsRow[1].dataset.character === "c" && figsRow[1].dataset.main === "true" && $$(mainRoot, '[data-main="true"]').length === 1,
    figsRow.map((x) => x.dataset.character).join(""));
  const artHeight = (fig) => rect(fig.querySelector(".character-art")).height;
  check("main character's figure is taller than the others'", artHeight(figsRow[1]) > artHeight(figsRow[0]) && artHeight(figsRow[1]) > artHeight(figsRow[2]),
    Math.round(artHeight(figsRow[0])) + " / " + Math.round(artHeight(figsRow[1])) + " / " + Math.round(artHeight(figsRow[2])) + " px");
  const dayForMain = hotDay[0];
  const mainEval = Recommend.evaluate(dayForMain);
  const mainState = AppStore.resolveWithCache(mainEval, austin, dayForMain.date, roster[2]);
  const expectedWording = mainState.activeReminders.map((r) => Variation.REMINDER_WORDINGS[r.type][Number(r.wordingVariation.split("-").pop()) - 1]);
  check("reminder wording on screen is the main character's wording, in order",
    same(expectedWording, $$(mainRoot, ".reminders li").map((li) => li.textContent.trim())) && expectedWording.length === 3, expectedWording.length + " reminders");
  check("main character's accessible name says (main)", figsRow[1].querySelector("svg").getAttribute("aria-label").includes("(main)"));
  const otherMain = (() => { // pick a main whose wording differs from c's for at least one reminder, across many dates
    for (let i = 0; i < 40; i++) {
      const d = Object.assign({}, dayForMain, { date: "2027-01-" + String(1 + (i % 28)).padStart(2, "0") });
      const a = AppStore.resolveWithCache(Recommend.evaluate(d), austin, d.date, roster[0]).activeReminders.map((r) => r.wordingVariation).join();
      const b = AppStore.resolveWithCache(Recommend.evaluate(d), austin, d.date, roster[2]).activeReminders.map((r) => r.wordingVariation).join();
      if (a !== b) return d;
    }
    return null;
  })();
  check("choosing a different main changes which wording shows (characters differ on some dates)", otherMain !== null);
  if (otherMain) {
    const days2 = makeDays({ 0: otherMain });
    App.render(mainRoot, { location: austin, days: days2, dayIndex: 0, characters: roster.slice(0, 3), mainId: "a" });
    const shownA = $$(mainRoot, ".reminders li").map((li) => li.textContent.trim());
    App.render(mainRoot, { location: austin, days: days2, dayIndex: 0, characters: roster.slice(0, 3), mainId: "c" });
    const shownC = $$(mainRoot, ".reminders li").map((li) => li.textContent.trim());
    check("same weather, main a vs main c -> different reminder wording on screen", !same(shownA, shownC), shownA.length + " vs " + shownC.length + " reminders");
  }

  // --- Narrow phone (320px) with a wide date: nothing may clip or overflow ---
  [320, 360].forEach((width) => {
    const narrow = document.createElement("div");
    narrow.style.cssText = "width:" + width + "px;height:640px;position:absolute;left:0;top:0;visibility:hidden";
    document.body.appendChild(narrow);
    const wideDays = makeDays({}).map((d, i) => (i === 0 ? Object.assign({}, d, { date: "2026-09-30" }) : d));
    App.render(narrow, { location: { name: "Minneapolis", state: "Minnesota", latitude: 44.98, longitude: -93.26 }, days: wideDays, dayIndex: 0, characters: roster.slice(0, 3), mainId: "b" });
    const btn = $(narrow, '[data-action="open-date"]');
    const span = $(btn, "span");
    check(width + "px phone: 'Wed, Sep 30' fits in the date button", span.getBoundingClientRect().width <= btn.clientWidth - 4 + 0.5,
      Math.round(span.getBoundingClientRect().width) + " px text in " + btn.clientWidth + " px button");
    const place = $(narrow, ".ctl-place");
    check(width + "px phone: long city is cut with an ellipsis inside its button, not spilling out (button stays in the frame)",
      rect(place).right <= rect(narrow).right + 0.5 && rect(btn).left >= rect(narrow).left);
    check(width + "px phone: no horizontal overflow of the screen", $(narrow, ".screen").scrollWidth <= $(narrow, ".screen").clientWidth + 1);
    check(width + "px phone: controls still at least 44px tall and 3 characters fit in the frame",
      $$(narrow, ".ctl").every((b) => rect(b).height >= 44 && rect(b).width >= 44) && $$(narrow, ".character").every((c) => rect(c).left >= -0.5 && rect(c).right <= width + 0.5));
  });

  // --- First run ---
  const nf = noLoc.querySelector(".case");
  check("first run: prompt to choose a location, no characters, no reminders", text(nf, ".place").startsWith("Choose a location") && $$(nf, ".character").length === 0);

  // --- Loading and error text via start() with stubbed fetches ---
  (async () => {
    AppStore.setLocation(austin);
    const realFetch = WeatherApi.fetchWeather;
    const root = document.createElement("div");

    let release;
    WeatherApi.fetchWeather = () => new Promise((resolve) => { release = resolve; });
    const started = App.start(root);
    check("start(): shows 'Loading' while the weather is on its way", text(root, "p") === "Loading", text(root, "p"));
    release({ days: makeDays({}) });
    await started;
    check("start(): replaces Loading with the weather screen once data arrives", $(root, ".temp") !== null && text(root, ".temp") === "68°F", text(root, ".temp"));

    const E = WeatherApi.WeatherApiError;
    for (const [code, want] of [["network", "Error. Reload the page."], ["service", "Error. Reload the page."], ["missing", "Missing data, try again in a moment."]]) {
      WeatherApi.fetchWeather = () => Promise.reject(new E(code, "x"));
      await App.start(root);
      check("start(): " + code + " error -> '" + want + "'", text(root, "p") === want, text(root, "p"));
    }
    WeatherApi.fetchWeather = realFetch;

    AppStore.clearAll();
    const empty = document.createElement("div");
    await App.start(empty);
    check("start(): no saved location -> choose-a-location screen (no fetch)", text(empty, ".place").startsWith("Choose a location"));

    lines.push(failed ? failed + " FAILED" : "ALL PASSED (" + lines.length + " checks)");
    document.getElementById("out").textContent = lines.join("\n");
    document.title = failed ? "FAILED" : "PASSED";
  })().catch((e) => {
    document.getElementById("out").textContent = lines.join("\n") + "\nCRASH: " + e + "\n" + (e.stack || "");
    document.title = "FAILED";
  });
</script>
</body>
</html>
