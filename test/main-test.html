<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Main screen tests</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    /* Harness only: html/body/#app are 100% tall in the real page, so give each phone a fixed frame. */
    html, body { height: auto; background: #777; }
    #cases { display: flex; gap: 16px; align-items: flex-start; padding: 8px; }
    .case { width: 390px; height: 700px; position: relative; background: #fff; flex: none; }
    .label { color: #fff; font: 12px monospace; margin: 0 0 2px; }
    pre#out { margin: 0; padding: 8px; background: #fff; font-size: 13px; }
    /* Hidden views must stay laid out (visibility, not display:none) or every measurement reads 0. */
    body[data-view="results"] #cases { visibility: hidden; position: absolute; top: 0; }
    body[data-view="cases"] pre#out { display: none; }
  </style>
</head>
<body>
<pre id="out">running...</pre>
<div id="cases"></div>
<script src="../js/weather.js"></script>
<script src="../js/recommend.js"></script>
<script src="../js/variation.js"></script>
<script src="../js/traits.js"></script>
<script src="../js/store.js"></script>
<script src="../js/art.js"></script>
<script src="../js/app.js"></script>
<script>
  // Renders canned weather through the real App.render, then checks what is actually in the DOM.
  document.body.dataset.view = new URLSearchParams(location.search).get("view") || "";
  const lines = [];
  let failed = 0;
  function check(name, ok, detail) {
    if (!ok) failed++;
    lines.push((ok ? "PASS " : "FAIL ") + name + (detail ? "  -> " + detail : ""));
  }

  const austin = { name: "Austin", state: "Texas", latitude: 30.26715, longitude: -97.74306 };
  const base = { temperatureF: 68, highF: 68, lowF: 55, precipProbability: 5, uvIndex: 1, windMph: 4, humidity: 50, weatherCode: 2 };
  // 15 plain days starting 2026-10-12; `over` patches individual days by index.
  function makeDays(over) {
    return Array.from({ length: 15 }, (_, i) =>
      Object.assign({ date: "2026-10-" + String(12 + i).padStart(2, "0"), isToday: i === 0 }, base, (over && over[i]) || {}));
  }
  const char = (id, personality) => ({ id: id, personality: personality });
  const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);

  const cases = [
    { id: "hot", title: "Hot, humid, sunny - today - 1 character",
      days: makeDays({ 0: { temperatureF: 88.3, humidity: 76, precipProbability: 19, uvIndex: 4.9, windMph: 6, weatherCode: 1 } }),
      dayIndex: 0, chars: [char("c1", "chill")] },
    { id: "freeze", title: "Snowy freezing forecast - day +3 - 2 characters",
      days: makeDays({ 3: { temperatureF: 28, highF: 28, humidity: 60, precipProbability: 10, windMph: 15, weatherCode: 71 } }),
      dayIndex: 3, chars: [char("c1", "grumpy"), char("c2", "anxious")] },
    { id: "rain", title: "Rainy mild - today - 5 characters",
      days: makeDays({ 0: { temperatureF: 64, humidity: 80, precipProbability: 70, weatherCode: 61 } }),
      dayIndex: 0, chars: [char("c1", "energetic"), char("c2", "anxious"), char("c3", "grumpy"), char("c4", "chill"), char("c5", "neutral")] },
    { id: "calm", title: "Calm mild day - today - no reminders",
      days: makeDays({}), dayIndex: 0, chars: [char("c1", "neutral")] },
  ];

  AppStore.clearAll();
  const cont = document.getElementById("cases");
  const frames = {};
  cases.forEach((c) => {
    const wrap = document.createElement("div");
    wrap.innerHTML = '<p class="label">' + c.title + '</p><div class="case"></div>';
    cont.appendChild(wrap);
    frames[c.id] = wrap.querySelector(".case");
    App.render(frames[c.id], { location: austin, days: c.days, dayIndex: c.dayIndex, characters: c.chars });
  });
  // First-run state (no saved location), rendered as a fifth frame.
  const noLoc = document.createElement("div");
  noLoc.innerHTML = '<p class="label">First run - no saved location</p><div class="case"></div>';
  cont.appendChild(noLoc);
  App.renderNoLocation(noLoc.querySelector(".case"));

  const $ = (root, sel) => root.querySelector(sel);
  const $$ = (root, sel) => Array.from(root.querySelectorAll(sel));
  const text = (root, sel) => ($(root, sel) ? $(root, sel).textContent.trim() : null);
  const rect = (el) => el.getBoundingClientRect();

  // --- Case: hot, humid, sunny, today ---
  let f = frames.hot;
  check("hot/today: shows 88F with the degree symbol and unit", text(f, ".temp") === "88°F", text(f, ".temp"));
  check("hot/today: condition text is Sunny", text(f, ".cond") === "Sunny", text(f, ".cond"));
  check("hot/today: no Forecast badge, no 'High' prefix", !$(f, ".badge") && !text(f, ".temp").startsWith("High"));
  check("hot/today: date reads Mon, Oct 12", text(f, ".date") === "Mon, Oct 12", text(f, ".date"));
  check("hot/today: location reads Austin, TX", text(f, ".place") === "Austin, TX", text(f, ".place"));
  check("hot/today: reminders are sunscreen + hydration only (from UV 4.9, heat index ~105; rain 19%)",
    $$(f, ".reminders li").map((li) => li.dataset.reminder).join() === "sunscreen,hydration");
  check("hot/today: reminder text is one of the defined wordings",
    $$(f, ".reminders li").every((li) => Variation.REMINDER_WORDINGS[li.dataset.reminder].includes(li.textContent.trim())));
  check("hot/today: 1 character, outfit is a 'hot' variation", $$(f, ".character").length === 1 && $(f, ".character").dataset.outfit.startsWith("hot-"), $(f, ".character").dataset.outfit);
  check("hot/today: data source credit with Open-Meteo link", $(f, '.source a[href="https://open-meteo.com/"]') !== null);

  // --- Case: snowy freezing forecast, day +3 ---
  f = frames.freeze;
  check("freeze/forecast: shows 'High 28°F'", text(f, ".temp") === "High 28°F", text(f, ".temp"));
  check("freeze/forecast: Forecast badge present", text(f, ".badge") === "Forecast");
  check("freeze/forecast: date reads Thu, Oct 15", text(f, ".date").startsWith("Thu, Oct 15"), text(f, ".date"));
  check("freeze/forecast: condition text is Snow", text(f, ".cond") === "Snow");
  check("freeze/forecast: cold caution shown (28F with 15 mph wind), no sunscreen/umbrella/hydration",
    $$(f, ".reminders li").map((li) => li.dataset.reminder).join() === "cold_caution");
  check("freeze/forecast: 2 characters, both in a 'freezing' outfit", $$(f, ".character").length === 2 && $$(f, ".character").every((c) => c.dataset.outfit.startsWith("freezing-")));

  // --- Case: rainy mild, 5 characters ---
  f = frames.rain;
  check("rain/today: condition text is Rain", text(f, ".cond") === "Rain");
  check("rain/today: umbrella is the only reminder", $$(f, ".reminders li").map((li) => li.dataset.reminder).join() === "umbrella");
  check("rain/today: 5 characters shown side by side", $$(f, ".character").length === 5);
  const figs = $$(f, ".character").map((c) => rect(c));
  check("rain/today: the 5 characters sit in one row without overlapping each other",
    figs.every((r, i) => i === 0 || r.left >= figs[i - 1].right - 0.5) && figs.every((r) => Math.abs(r.bottom - figs[0].bottom) < 2),
    figs.map((r) => Math.round(r.width)).join("/") + " px wide");
  check("rain/today: all 5 stay inside the 390px phone frame", figs.every((r) => r.left >= rect(f).left - 0.5 && r.right <= rect(f).right + 0.5));

  // --- Case: calm day ---
  f = frames.calm;
  check("calm/today: no reminder block at all when nothing triggers", $(f, ".reminders") === null);
  check("calm/today: condition text is Partly cloudy", text(f, ".cond") === "Partly cloudy");

  // --- One state drives everything (every case) ---
  cases.forEach((c) => {
    const root = frames[c.id];
    const day = c.days[c.dayIndex];
    const evaluation = Recommend.evaluate(day);
    const state = AppStore.resolveWithCache(evaluation, austin, day.date, c.chars[0]);
    const label = Art.WEATHER_ICONS[state.weatherConditionIcon].label;
    check(c.id + ": big scene icon, condition text and state icon all agree (" + state.weatherConditionIcon + ")",
      $(root, ".sky-icon").dataset.icon === state.weatherConditionIcon && text(root, ".cond") === label);
    check(c.id + ": every caption is the exact outfit named by that character's state",
      $$(root, ".character").every((el, i) => {
        const s = AppStore.resolveWithCache(evaluation, austin, day.date, c.chars[i]);
        const v = Object.values(Variation.OUTFIT_VARIATIONS).flat().find((x) => x.id === s.outfitVariation);
        return el.dataset.outfit === s.outfitVariation && el.querySelector("figcaption").textContent === v.name &&
          el.querySelector("svg").getAttribute("aria-label").includes(v.name.toLowerCase());
      }));
  });

  // --- Layout: text block never covers the characters; controls are big enough ---
  cases.forEach((c) => {
    const root = frames[c.id];
    const summaryBottom = rect($(root, ".summary")).bottom;
    // The figure is drawn at the bottom of its box (aspect 120:232), so measure where it really starts.
    const topOfArt = Math.min(...$$(root, ".character-art").map((a) => { const r = rect(a); return r.bottom - Math.min(r.height, (r.width * 232) / 120); }));
    check(c.id + ": weather text ends above the characters (" + Math.round(summaryBottom) + " <= " + Math.round(topOfArt) + ")", summaryBottom <= topOfArt + 0.5);
    check(c.id + ": date stepper (previous, date, next) and location buttons are all at least 44x44",
      $$(root, ".ctl").length === 4 && $$(root, ".ctl").every((b) => rect(b).width >= 44 && rect(b).height >= 44));
    const frameRect = rect(root);
    check(c.id + ": date and location controls sit in the lower third of the phone (thumb reach)",
      $$(root, ".ctl").every((b) => rect(b).top >= frameRect.top + (frameRect.height * 2) / 3),
      "controls top at " + Math.round(rect($(root, ".controls")).top - frameRect.top) + " of " + Math.round(frameRect.height) + " px");
    // Text must fit inside its button: a clipped "Mon, Oct 1" next to an arrow is a real defect.
    const fits = (btn) => { const s = btn.querySelector("span"), st = getComputedStyle(btn); return s.getBoundingClientRect().width <= btn.clientWidth - parseFloat(st.paddingLeft) - parseFloat(st.paddingRight) + 0.5; };
    check(c.id + ": the date text fits inside its button (not clipped by the arrows)", fits($(root, '[data-action="open-date"]')),
      Math.round($(root, '[data-action="open-date"] span').getBoundingClientRect().width) + " px text in " + $(root, '[data-action="open-date"]').clientWidth + " px button");
    check(c.id + ": date button shows the selected date", $(root, '[data-action="open-date"]').textContent.trim() === text(root, ".date").replace("Forecast", "").trim());
    check(c.id + ": bottom nav has Home, Character, Settings, each at least 44 tall",
      $$(root, ".tab").map((t) => t.textContent.trim()).join() === "Home,Character,Settings" && $$(root, ".tab").every((t) => rect(t).height >= 44));
    check(c.id + ": every role=img SVG has a label", $$(root, 'svg[role="img"]').every((s) => s.getAttribute("aria-label")));
  });

  // --- Drawing matches the written outfit name (guards against name/art drift) ---
  const allOutfits = Object.values(Variation.OUTFIT_VARIATIONS).flat();
  check("every outfit id has a placeholder drawing spec", allOutfits.every((v) => Art.OUTFIT_LOOK[v.id]), allOutfits.length + " outfits");
  const nameRules = [
    [/tank|crop top/i, "sleeves", "none"],
    [/\btee\b|polo/i, "sleeves", "short"],
    [/long.sleeve|sweater|jacket|coat|parka|puffer|hoodie|sweatshirt|windbreaker/i, "sleeves", "long"],
    [/shorts/i, "pants", "short"],
    [/jeans|pants|joggers|leggings|sweats/i, "pants", "long"],
  ];
  const mismatches = [];
  allOutfits.forEach((v) => {
    const look = Art.OUTFIT_LOOK[v.id] || {};
    nameRules.forEach(([pattern, field, want]) => {
      if (pattern.test(v.name) && look[field] !== want) mismatches.push(v.id + ' "' + v.name + '": ' + field + " is " + look[field] + ", name implies " + want);
    });
    if (/coat|parka|puffer/i.test(v.name) && !look.coat) mismatches.push(v.id + ": name has a coat but drawing has none");
    // Accessories must match in BOTH directions: drawn if and only if the name mentions them.
    [["cap", /\bcap\b/i], ["sunHat", /sun hat/i], ["beanie", /beanie/i], ["scarf", /scarf/i], ["glasses", /sunglasses/i]].forEach(([flag, pattern]) => {
      if (pattern.test(v.name) !== Boolean(look[flag])) mismatches.push(v.id + ' "' + v.name + '": ' + flag + " is " + Boolean(look[flag]) + " but the name says " + pattern.test(v.name));
    });
  });
  check("each outfit's drawing (sleeves, pants, coat, hats, scarf, sunglasses) agrees with its written name", mismatches.length === 0, mismatches.join(" | "));
  const rendered = frames.hot.querySelector(".character-art").outerHTML;
  check("hot-day figure shows its outfit: hot-2 'light long sleeves, sun hat, sunglasses' draws sleeves and a hat and glasses",
    $(frames.hot, ".character").dataset.outfit !== "hot-2" || (rendered.includes("#d8c08a") && rendered.includes('fill="#1d1d1d"')));

  // --- Main character: in the middle, bigger, and the reminders use its wording ---
  const roster = [char("a", "energetic"), char("b", "anxious"), char("c", "grumpy"), char("d", "chill"), char("e", "neutral")];
  const orderIds = (n, mainId) => App.orderForStage(roster.slice(0, n), mainId).map((x) => x.id).join("");
  check("stage order: 1 character -> a", orderIds(1, "a") === "a");
  check("stage order: 2 characters, main b -> a b (main on the right of centre)", orderIds(2, "b") === "ab");
  check("stage order: 3 characters, main c -> a c b (main exactly in the middle)", orderIds(3, "c") === "acb", orderIds(3, "c"));
  check("stage order: 5 characters, main e -> a b e c d (main exactly in the middle)", orderIds(5, "e") === "abecd", orderIds(5, "e"));
  check("stage order: 5 characters, main a -> b c a d e", orderIds(5, "a") === "bcade", orderIds(5, "a"));
  check("stage order: unknown main id falls back to the first character as main (b a c)", orderIds(3, "zzz") === "bac", orderIds(3, "zzz"));

  const hotDay = makeDays({ 0: { temperatureF: 92, humidity: 60, precipProbability: 70, uvIndex: 7, weatherCode: 95 } });
  const mainRoot = document.createElement("div");
  mainRoot.style.cssText = "width:390px;height:700px;position:absolute;left:0;top:0;visibility:hidden"; // laid out, not shown
  document.body.appendChild(mainRoot);
  App.render(mainRoot, { location: austin, days: hotDay, dayIndex: 0, characters: roster.slice(0, 3), mainId: "c" });
  const figsRow = $$(mainRoot, ".character");
  check("main character renders in the middle slot and is flagged main", figsRow.length === 3 && figsRow[1].dataset.character === "c" && figsRow[1].dataset.main === "true" && $$(mainRoot, '[data-main="true"]').length === 1,
    figsRow.map((x) => x.dataset.character).join(""));
  const artHeight = (fig) => rect(fig.querySelector(".character-art")).height;
  check("main character's figure is taller than the others'", artHeight(figsRow[1]) > artHeight(figsRow[0]) && artHeight(figsRow[1]) > artHeight(figsRow[2]),
    Math.round(artHeight(figsRow[0])) + " / " + Math.round(artHeight(figsRow[1])) + " / " + Math.round(artHeight(figsRow[2])) + " px");
  const dayForMain = hotDay[0];
  const mainEval = Recommend.evaluate(dayForMain);
  const mainState = AppStore.resolveWithCache(mainEval, austin, dayForMain.date, roster[2]);
  const expectedWording = mainState.activeReminders.map((r) => Variation.REMINDER_WORDINGS[r.type][Number(r.wordingVariation.split("-").pop()) - 1]);
  check("reminder wording on screen is the main character's wording, in order",
    same(expectedWording, $$(mainRoot, ".reminders li").map((li) => li.textContent.trim())) && expectedWording.length === 3, expectedWording.length + " reminders");
  check("main character's accessible name says (main)", figsRow[1].querySelector("svg").getAttribute("aria-label").includes("(main)"));
  const otherMain = (() => { // pick a main whose wording differs from c's for at least one reminder, across many dates
    for (let i = 0; i < 40; i++) {
      const d = Object.assign({}, dayForMain, { date: "2027-01-" + String(1 + (i % 28)).padStart(2, "0") });
      const a = AppStore.resolveWithCache(Recommend.evaluate(d), austin, d.date, roster[0]).activeReminders.map((r) => r.wordingVariation).join();
      const b = AppStore.resolveWithCache(Recommend.evaluate(d), austin, d.date, roster[2]).activeReminders.map((r) => r.wordingVariation).join();
      if (a !== b) return d;
    }
    return null;
  })();
  check("choosing a different main changes which wording shows (characters differ on some dates)", otherMain !== null);
  if (otherMain) {
    const days2 = makeDays({ 0: otherMain });
    App.render(mainRoot, { location: austin, days: days2, dayIndex: 0, characters: roster.slice(0, 3), mainId: "a" });
    const shownA = $$(mainRoot, ".reminders li").map((li) => li.textContent.trim());
    App.render(mainRoot, { location: austin, days: days2, dayIndex: 0, characters: roster.slice(0, 3), mainId: "c" });
    const shownC = $$(mainRoot, ".reminders li").map((li) => li.textContent.trim());
    check("same weather, main a vs main c -> different reminder wording on screen", !same(shownA, shownC), shownA.length + " vs " + shownC.length + " reminders");
  }

  // --- Narrow phone (320px) with a wide date: nothing may clip or overflow ---
  [320, 360].forEach((width) => {
    const narrow = document.createElement("div");
    narrow.style.cssText = "width:" + width + "px;height:640px;position:absolute;left:0;top:0;visibility:hidden";
    document.body.appendChild(narrow);
    const wideDays = makeDays({}).map((d, i) => (i === 0 ? Object.assign({}, d, { date: "2026-09-30" }) : d));
    App.render(narrow, { location: { name: "Minneapolis", state: "Minnesota", latitude: 44.98, longitude: -93.26 }, days: wideDays, dayIndex: 0, characters: roster.slice(0, 3), mainId: "b" });
    const btn = $(narrow, '[data-action="open-date"]');
    const span = $(btn, "span");
    check(width + "px phone: 'Wed, Sep 30' fits in the date button", span.getBoundingClientRect().width <= btn.clientWidth - 4 + 0.5,
      Math.round(span.getBoundingClientRect().width) + " px text in " + btn.clientWidth + " px button");
    const place = $(narrow, ".ctl-place");
    check(width + "px phone: long city is cut with an ellipsis inside its button, not spilling out (button stays in the frame)",
      rect(place).right <= rect(narrow).right + 0.5 && rect(btn).left >= rect(narrow).left);
    check(width + "px phone: no horizontal overflow of the screen", $(narrow, ".screen").scrollWidth <= $(narrow, ".screen").clientWidth + 1);
    check(width + "px phone: controls still at least 44px tall and 3 characters fit in the frame",
      $$(narrow, ".ctl").every((b) => rect(b).height >= 44 && rect(b).width >= 44) && $$(narrow, ".character").every((c) => rect(c).left >= -0.5 && rect(c).right <= width + 0.5));
  });

  // --- First run ---
  const nf = noLoc.querySelector(".case");
  check("first run: prompt to choose a location, no characters, no reminders", text(nf, ".place").startsWith("Choose a location") && $$(nf, ".character").length === 0);

  // --- Loading and error text via start() with stubbed fetches ---
  (async () => {
    AppStore.setLocation(austin);
    const realFetch = WeatherApi.fetchWeather;
    const root = document.createElement("div");

    let release;
    WeatherApi.fetchWeather = () => new Promise((resolve) => { release = resolve; });
    const started = App.start(root);
    check("start(): shows 'Loading' while the weather is on its way", text(root, "p") === "Loading", text(root, "p"));
    release({ days: makeDays({}) });
    await started;
    check("start(): replaces Loading with the weather screen once data arrives", $(root, ".temp") !== null && text(root, ".temp") === "68°F", text(root, ".temp"));

    const E = WeatherApi.WeatherApiError;
    for (const [code, want] of [["network", "Error. Reload the page."], ["service", "Error. Reload the page."], ["missing", "Missing data, try again in a moment."]]) {
      WeatherApi.fetchWeather = () => Promise.reject(new E(code, "x"));
      await App.start(root);
      check("start(): " + code + " error -> '" + want + "'", text(root, "p") === want, text(root, "p"));
    }
    WeatherApi.fetchWeather = realFetch;

    AppStore.clearAll();
    const empty = document.createElement("div");
    await App.start(empty);
    check("start(): no saved location -> choose-a-location screen (no fetch)", text(empty, ".place").startsWith("Choose a location"));

    lines.push(failed ? failed + " FAILED" : "ALL PASSED (" + lines.length + " checks)");
    document.getElementById("out").textContent = lines.join("\n");
    document.title = failed ? "FAILED" : "PASSED";
  })().catch((e) => {
    document.getElementById("out").textContent = lines.join("\n") + "\nCRASH: " + e + "\n" + (e.stack || "");
    document.title = "FAILED";
  });
</script>
</body>
</html>
