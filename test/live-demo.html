<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live demo</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <!-- Saves a location and characters, then runs the real App.start against live Open-Meteo.
       Query: ?city=Dallas%2C%20TX&personalities=chill,grumpy -->
  <div id="app"></div>
  <script src="../js/weather.js"></script>
  <script src="../js/recommend.js"></script>
  <script src="../js/variation.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/art.js"></script>
  <script src="../js/app.js"></script>
  <script>
    (async () => {
      const params = new URLSearchParams(location.search);
      AppStore.clearAll();
      const place = (await WeatherApi.geocodeCity(params.get("city") || "Austin, TX"))[0];
      AppStore.setLocation(place);
      const personalities = (params.get("personalities") || "chill").split(",");
      AppStore.saveCharacters(personalities.map((p, i) => ({ id: "char-" + (i + 1), personality: p })));
      await App.start(document.getElementById("app"));
      document.title = "LOADED";
    })();
  </script>
</body>
</html>
