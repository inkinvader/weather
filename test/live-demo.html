<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live demo</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    html, body { height: auto; background: #777; }
    .frame { width: 390px; height: 760px; margin: 8px; position: relative; background: #fff; }
  </style>
</head>
<body>
  <!-- Phone-sized frame running the real App against live Open-Meteo, for screenshots.
       ?city=Dallas%2C%20TX  &personalities=chill,grumpy  &main=2  &sheet=date|location|results  &day=3 -->
  <div class="frame"><div id="app" style="height:100%"></div></div>
  <script src="../js/weather.js"></script>
  <script src="../js/recommend.js"></script>
  <script src="../js/variation.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/art.js"></script>
  <script src="../js/app.js"></script>
  <script>
    (async () => {
      const params = new URLSearchParams(location.search);
      const root = document.getElementById("app");
      AppStore.clearAll();
      const personalities = (params.get("personalities") || "chill").split(",");
      AppStore.saveCharacters(personalities.map((p, i) => ({ id: "char-" + (i + 1), personality: p })));
      if (params.get("main")) AppStore.setMainCharacterId("char-" + params.get("main"));
      if (params.get("city")) AppStore.setLocation((await WeatherApi.geocodeCity(params.get("city")))[0]);
      await App.start(root);
      const wait = () => new Promise((r) => setTimeout(r, 1500));
      if (params.get("day")) for (let i = 0; i < Number(params.get("day")); i++) root.querySelector('[data-action="next-day"]').click();
      const sheet = params.get("sheet");
      if (sheet === "date") root.querySelector('[data-action="open-date"]').click();
      if (sheet === "location") root.querySelector('[data-action="open-location"]').click();
      if (sheet === "results") {
        root.querySelector('[data-action="open-location"]').click();
        root.querySelector("#city-input").value = "Austin";
        root.querySelector("form.search").requestSubmit();
        await wait();
      }
      document.title = "LOADED";
    })();
  </script>
</body>
</html>
